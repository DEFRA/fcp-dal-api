extend type Query {
  """
  Get a customer by CRN (Customer Reference Number, a 10-digit number).
  """
  customer(crn: ID! @validateVariable(pattern: "^[1-9][0-9]{9}$")): Customer
    @auth(requires: [CONSOLIDATED_VIEW, SINGLE_FRONT_DOOR, SFI_REFORM])

  """
  Search for customers by CRN, personal identifier, customer name, customer postcode,
  vendor number, or trader number.
  """
  customerSearch(
    searchString: String!
    searchType: CustomerSearchFieldType!
    pagination: Pagination
  ): CustomerSearchResponse @auth(requires: [CONSOLIDATED_VIEW, SINGLE_FRONT_DOOR, SFI_REFORM])

  """
  Check whether an email address is already registered (i.e. already in use by another customer).
  Customers whose email address has not been verified are not included, so an unverified email
  in use by another customer will not be reported as registered.
  """
  isCustomerEmailRegistered(email: String!): Boolean! @auth(requires: [SINGLE_FRONT_DOOR])
}
