"Represents data about a customers or business address details, note the Version 1 api does not require any of these fields so neither do we."
input AddressInput {
  """
  PAF organisation name
  """
  pafOrganisationName: String @validateVariable(pattern: "^.{0,240}$")

  """
  First line of a non-PAF address (maybe duplicated in the named fields, but not always)
  """
  line1: String @validateVariable(pattern: "^.{0,240}$")

  """
  Second line of a non-PAF address (maybe duplicated in the named fields, but not always)
  """
  line2: String @validateVariable(pattern: "^.{0,240}$")

  """
  Third line of a non-PAF address (maybe duplicated in the named fields, but not always)
  """
  line3: String @validateVariable(pattern: "^.{0,240}$")

  """
  Fourth line of a non-PAF address (maybe duplicated in the named fields, but not always)
  """
  line4: String @validateVariable(pattern: "^.{0,240}$")

  """
  Fifth line of a non-PAF address (maybe duplicated in the named fields, but not always)
  """
  line5: String @validateVariable(pattern: "^.{0,240}$")

  """
  Building number range of the address
  """
  buildingNumberRange: String @validateVariable(pattern: "^.{0,240}$")

  """
  Building name of the address
  """
  buildingName: String @validateVariable(pattern: "^.{0,240}$")

  """
  Flat name of the address
  """
  flatName: String @validateVariable(pattern: "^.{0,240}$")

  """
  Street of the address
  """
  street: String @validateVariable(pattern: "^.{0,240}$")

  """
  Locality of the address
  """
  city: String @validateVariable(pattern: "^.{0,60}$")

  """
  County of the address
  """
  county: String @validateVariable(pattern: "^.{0,60}$")

  """
  Postal code of the address
  """
  postalCode: String @validateVariable(pattern: "^.{0,8}$")

  """
  Country of the address
  """
  country: String @validateVariable(pattern: "^.{0,100}$")

  """
  UPRN of the address
  """
  uprn: String @validateVariable(pattern: "^[0-9]{0,12}$")

  """
  Dependant locality of the address
  """
  dependentLocality: String @validateVariable(pattern: "^.{0,240}$")

  """
  Double dependant locality of the address
  """
  doubleDependentLocality: String @validateVariable(pattern: "^.{0,240}$")
}

input ValidAddressInput @oneOf {
  withUprn: AddressInputWithUprn
  withoutUprn: AddressInputWithoutUprn
}

