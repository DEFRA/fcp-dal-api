name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  coverage-snapshot:
    name: Snapshot base coverage for PR comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm run postinstall
      - name: Run unit + graphql tests with coverage
        run: npm test -- --ci --json --testLocationInResults --outputFile=report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-main
          path: report.json
          retention-days: 30

  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Depth 0 is required for tag-based auto-versioning

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@f13fc42004f99a1df2e21ce1ff488cc72c897e40 # 17 Jul 2026
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Patch releases are reserved for hotfixes (publish-hotfix.yml).
          # Disabling the #patch commit-message trigger here means main can
          # only bump minor/major, so it can never independently produce the
          # same vX.Y.Z tag a hotfix branch computes off an older ancestor.
          PATCH_STRING_TOKEN: disabled-on-main-do-not-use

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
