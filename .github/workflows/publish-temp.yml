name: Publish Temp Build

# Manual, disposable publish for trying out a branch in a CDP environment.
# This build is not intended to ever be promoted to prod.
#
# Uses build-hotfix (same as publish-hotfix.yml): it never tags the image
# defradigital/<repo>:latest, and already refuses to run on main. It has no
# official version input, but CUSTOM_TAG (an anothrNick/github-tag-action
# env var) flows through and overrides its auto-versioning - pinned here to
# 0.0.<run number>, well outside the real release/hotfix vX.Y.Z range, so it
# can never collide with an actual release or hotfix tag. Note this still
# creates a real (if disjoint) git tag, unlike a plain no-tag dry run.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    name: CDP-build-temp-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Depth 0 is required for branch-based versioning

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: |
          npm audit --omit=dev
          npm ci --ignore-scripts
          npm run postinstall
          npm run lint
          npm test

      - name: Build and Publish (temp, non-prod)
        uses: DEFRA/cdp-build-action/build-hotfix@f13fc42004f99a1df2e21ce1ff488cc72c897e40 # 17 Jul 2026
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CUSTOM_TAG: 0.0.${{ github.run_number }}
